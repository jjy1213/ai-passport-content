name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths: [site/**, themes.json, themes/**, courses/**, firmware/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage public content
        run: |
          cp themes.json site/themes.json
          cp -R themes site/themes
          cp -R courses site/courses
          cp -R firmware site/firmware
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
